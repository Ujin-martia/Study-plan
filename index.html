<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>StudyHub 🧋 — คลังอ่านหนังสือ PT</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600&display=swap"
  rel="stylesheet"
/>

<!-- Tailwind via Play CDN — no build step needed -->
<script>
  tailwind = { config: {
    theme: {
      extend: {
        colors: {
          brown: { DEFAULT: '#7C5C43', dark: '#5D4433', light: '#8D6E63' },
          milktea: { DEFAULT: '#D7CCC8', light: '#EFEBE9', caramel: '#F5E6D3' },
          cream: { DEFAULT: '#FAF6F0', bg: '#FFFDF9', card: '#FFF9F2' },
          status: {
            notread: '#D9D2C7',
            reading: '#F3D98B',
            read: '#B7C9A0',
            reviewed: '#F0B57A',
            ready: '#E89B9B',
          },
        },
        fontFamily: {
          display: ['Kanit', 'system-ui', 'sans-serif'],
          body: ['Sarabun', 'system-ui', 'sans-serif'],
        },
        boxShadow: {
          cozy: '0 4px 20px -4px rgba(124, 92, 67, 0.15)',
          'cozy-lg': '0 8px 30px -6px rgba(124, 92, 67, 0.2)',
        },
      },
    },
  }};
</script>
<script src="https://cdn.tailwindcss.com"></script>

<style>
  body { -webkit-font-smoothing: antialiased; }
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #D7CCC8; border-radius: 999px; }
  .blurred { filter: blur(6px); user-select: none; }
</style>
</head>
<body class="bg-cream-bg font-body text-brown-dark">
  <div id="app">
    <div class="min-h-screen flex items-center justify-center text-brown-light text-sm">กำลังเริ่มระบบ...</div>
  </div>

  <!-- Supabase JS v2, UMD build — works with a plain <script> tag, no bundler/module needed -->
  <script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- ============================================================
       ทั้งแอปอยู่ในไฟล์นี้ไฟล์เดียว — โค้ดทั้งหมดอยู่ใน <script> ข้างล่างนี้
       แก้ Supabase URL/Key ได้ที่ด้านบนสุดของ <script> (ค้นหาคำว่า CONFIG)
       ============================================================ -->
  <script>


// ============================================================
// CONFIG — แก้ 2 บรรทัดข้างล่างนี้ให้เป็นค่าจากโปรเจกต์ Supabase ของตัวเอง
// ============================================================
window.SH_CONFIG = {
  SUPABASE_URL: "https://YOUR-PROJECT.supabase.co",
  SUPABASE_ANON_KEY: "YOUR-ANON-PUBLIC-KEY",
};

// ============================================================
// StudyHub — core (namespace, utils, auth, router, shell, login)
// Plain classic script — works via file:// (no ES modules).
// Page modules attach themselves to window.SH.pages.*
// ============================================================
(function () {
  const SH = (window.SH = window.SH || {});
  SH.pages = SH.pages || {};

  // Supabase client (UMD global `supabase` comes from the CDN script tag)
  SH.client = supabase.createClient(window.SH_CONFIG.SUPABASE_URL, window.SH_CONFIG.SUPABASE_ANON_KEY);

  const app = document.getElementById("app");

  // ------------------------------------------------------------
  // Utils
  // ------------------------------------------------------------
  SH.esc = function (str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;");
  };

  SH.formatDate = function (iso) {
    if (!iso) return "";
    const d = new Date(iso);
    return d.toLocaleDateString("th-TH", { year: "numeric", month: "short", day: "numeric" });
  };

  SH.daysUntil = function (iso) {
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const target = new Date(iso);
    target.setHours(0, 0, 0, 0);
    return Math.round((target - today) / 86400000);
  };

  SH.todayStr = function () {
    return new Date().toISOString().slice(0, 10);
  };

  SH.go = function (hash) {
    location.hash = hash;
  };

  SH.STATUS_ORDER = ["ยังไม่อ่าน", "กำลังอ่าน", "อ่านแล้ว", "ทวนแล้ว", "พร้อมสอบ"];
  SH.STATUS_COLOR = {
    ยังไม่อ่าน: "bg-status-notread text-brown-dark",
    กำลังอ่าน: "bg-status-reading text-brown-dark",
    อ่านแล้ว: "bg-status-read text-white",
    ทวนแล้ว: "bg-status-reviewed text-white",
    พร้อมสอบ: "bg-status-ready text-white",
  };
  SH.BODY_REGIONS = [
    "Cervical", "Shoulder", "Elbow", "Wrist/Hand",
    "Thoracic/Lumbar", "Hip", "Knee", "Ankle/Foot",
  ];

  SH.heartRow = function (value, size, interactive) {
    size = size || 16;
    let out = `<div class="flex items-center gap-0.5">`;
    for (let n = 1; n <= 5; n++) {
      const filled = n <= value;
      out += `<button type="button" ${interactive ? `data-heart-value="${n}"` : "disabled"} class="${interactive ? "" : "cursor-default"}">
        <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? "#E89B9B" : "none"}" stroke="${filled ? "#E89B9B" : "#D7CCC8"}" stroke-width="2">
          <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.6l-1-1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21.2l7.8-7.8 1-1a5.5 5.5 0 0 0 0-7.8z"/>
        </svg>
      </button>`;
    }
    out += `</div>`;
    return out;
  };

  SH.comingSoonHtml = function (title) {
    return `
    <div class="p-6 max-w-3xl mx-auto">
      <div class="bg-white rounded-2xl shadow-cozy p-10 text-center">
        <div class="text-4xl mb-3">🧋</div>
        <h1 class="text-xl font-display font-semibold text-brown-dark mb-2">${SH.esc(title)}</h1>
        <p class="text-sm text-brown-light">โมดูลนี้อยู่ใน Phase ถัดไปของการพัฒนา — schema พร้อมแล้วใน Supabase, รอต่อ UI</p>
      </div>
    </div>`;
  };

  // ------------------------------------------------------------
  // Auth
  // ------------------------------------------------------------
  let currentSession = null;

  async function signInWithPassword(email, password) {
    const { error } = await SH.client.auth.signInWithPassword({ email, password });
    return error ? error.message : null;
  }
  async function signUp(email, password, fullName) {
    const { error } = await SH.client.auth.signUp({
      email, password, options: { data: { full_name: fullName } },
    });
    return error ? error.message : null;
  }
  async function signOut() {
    await SH.client.auth.signOut();
  }

  // ------------------------------------------------------------
  // Router
  // ------------------------------------------------------------
  SH.route = async function () {
    if (!currentSession) {
      renderLogin();
      return;
    }
    const hash = location.hash.replace(/^#/, "") || "/";
    const parts = hash.split("/").filter(Boolean);

    let activeNav = "/";
    let pageFn = null;
    let pageArgs = [];

    if (parts.length === 0) {
      pageFn = SH.pages.renderDashboard;
    } else if (parts[0] === "exams" && parts.length === 1) {
      activeNav = "/exams"; pageFn = SH.pages.renderExamsList;
    } else if (parts[0] === "exams" && parts.length === 2) {
      activeNav = "/exams"; pageFn = SH.pages.renderExamWorkspace; pageArgs = [parts[1]];
    } else if (parts[0] === "exams" && parts.length === 4 && parts[2] === "topics") {
      activeNav = "/exams"; pageFn = SH.pages.renderTopicDetail; pageArgs = [parts[1], parts[3]];
    } else if (parts[0] === "special-tests" && parts.length === 1) {
      activeNav = "/special-tests"; pageFn = SH.pages.renderSpecialTests;
    } else if (parts[0] === "special-tests" && parts.length === 2) {
      activeNav = "/special-tests"; pageFn = SH.pages.renderSpecialTestDetail; pageArgs = [parts[1]];
    } else if (parts[0] === "flashcards") {
      activeNav = "/flashcards"; pageFn = SH.pages.renderFlashcards;
    } else if (parts[0] === "drugs" && parts.length === 1) {
      activeNav = "/drugs"; pageFn = SH.pages.renderDrugLibrary;
    } else if (parts[0] === "drugs" && parts.length === 2) {
      activeNav = "/drugs"; pageFn = SH.pages.renderDrugDetail; pageArgs = [parts[1]];
    } else if (parts[0] === "aha-notes") {
      activeNav = "/aha-notes"; pageFn = (c) => { c.innerHTML = SH.comingSoonHtml("Aha / Wow Notes"); };
    } else if (parts[0] === "mistakes") {
      activeNav = "/mistakes"; pageFn = (c) => { c.innerHTML = SH.comingSoonHtml("Mistake Book"); };
    } else {
      pageFn = (c) => { c.innerHTML = `<div class="p-6 text-brown-light">ไม่พบหน้านี้</div>`; };
    }

    app.innerHTML = shell(activeNav);
    wireLayoutEvents();
    const container = document.getElementById("page-content");
    container.innerHTML = `<div class="p-6 text-sm text-brown-light">กำลังโหลด...</div>`;
    await pageFn(container, ...pageArgs);
  };

  // ------------------------------------------------------------
  // Layout shell
  // ------------------------------------------------------------
  const NAV = [
    { to: "/", label: "หน้าหลัก", icon: "home" },
    { to: "/exams", label: "คลังสอบ", icon: "book" },
    { to: "/special-tests", label: "Special Tests", icon: "stethoscope" },
    { to: "/flashcards", label: "Flashcards", icon: "layers" },
    { to: "/drugs", label: "คลังยา", icon: "pill" },
    { to: "/aha-notes", label: "Aha Notes", icon: "lightbulb" },
    { to: "/mistakes", label: "Mistake Book", icon: "list-checks" },
  ];

  const ICONS = {
    home: `<path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>`,
    book: `<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v16H6.5A2.5 2.5 0 0 0 4 20.5z"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20"/>`,
    stethoscope: `<path d="M4.8 2.3v6.5a5.2 5.2 0 0 0 10.4 0V2.3"/><path d="M10 15.5a6 6 0 0 0 6 6 6 6 0 0 0 6-6v-2"/><circle cx="20" cy="6" r="2"/>`,
    layers: `<path d="M12 2 2 7l10 5 10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>`,
    pill: `<path d="m10.5 20.5 10-10a4.95 4.95 0 1 0-7-7l-10 10a4.95 4.95 0 1 0 7 7z"/><path d="m8.5 8.5 7 7"/>`,
    lightbulb: `<path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.2 1 2.3h6c0-1.1.4-1.9 1-2.3A7 7 0 0 0 12 2z"/>`,
    "list-checks": `<path d="m3 7 2 2 4-4"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 18h8"/>`,
  };

  function shell(activeNav) {
    return `
    <div class="min-h-screen flex bg-cream-bg">
      <aside class="hidden md:flex w-56 flex-col bg-white border-r border-milktea-light shadow-cozy p-4">
        <div class="text-xl font-display font-semibold text-brown mb-6 px-2">StudyHub 🧋</div>
        <nav class="flex-1 space-y-1">
          ${NAV.map(
            (n) => `
            <a href="#${n.to === "/" ? "" : n.to}" class="flex items-center gap-3 px-3 py-2 rounded-xl text-sm font-medium transition-colors ${
              activeNav === n.to ? "bg-milktea-caramel text-brown-dark" : "text-brown-light hover:bg-cream-card"
            }">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[n.icon]}</svg>
              ${n.label}
            </a>`
          ).join("")}
        </nav>
        <div class="pt-4 border-t border-milktea-light text-xs text-brown-light px-2">
          <div class="truncate mb-2">${SH.esc(currentSession && currentSession.user ? currentSession.user.email : "")}</div>
          <button id="signout-btn" class="flex items-center gap-2 text-brown hover:text-brown-dark">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            ออกจากระบบ
          </button>
        </div>
      </aside>
      <main class="flex-1 min-w-0" id="page-content"></main>
    </div>`;
  }

  function wireLayoutEvents() {
    const btn = document.getElementById("signout-btn");
    if (btn) btn.addEventListener("click", async () => { await signOut(); });
  }

  // ------------------------------------------------------------
  // Login page
  // ------------------------------------------------------------
  function renderLogin() {
    app.innerHTML = `
    <div class="min-h-screen flex items-center justify-center bg-cream-bg px-4">
      <div class="w-full max-w-sm bg-white rounded-3xl shadow-cozy-lg p-8">
        <div class="text-center mb-6">
          <div class="text-4xl mb-2">🧋</div>
          <h1 class="text-2xl font-display font-semibold text-brown-dark">StudyHub</h1>
          <p class="text-sm text-brown-light mt-1">คลังอ่านหนังสือน่ารัก ๆ สำหรับนักศึกษา PT</p>
        </div>
        <form id="auth-form" class="space-y-3">
          <div id="fullname-wrap" class="hidden">
            <input type="text" id="full_name" placeholder="ชื่อ-นามสกุล" class="w-full px-4 py-2.5 rounded-xl border border-milktea-light bg-cream-card focus:outline-none focus:ring-2 focus:ring-brown-light" />
          </div>
          <input type="email" id="email" placeholder="อีเมล" required class="w-full px-4 py-2.5 rounded-xl border border-milktea-light bg-cream-card focus:outline-none focus:ring-2 focus:ring-brown-light" />
          <input type="password" id="password" placeholder="รหัสผ่าน" required minlength="6" class="w-full px-4 py-2.5 rounded-xl border border-milktea-light bg-cream-card focus:outline-none focus:ring-2 focus:ring-brown-light" />
          <p id="auth-error" class="text-sm text-status-ready hidden"></p>
          <button type="submit" id="auth-submit" class="w-full py-2.5 rounded-full bg-brown text-white font-medium shadow-cozy hover:bg-brown-dark transition-colors disabled:opacity-60">เข้าสู่ระบบ</button>
        </form>
        <button id="mode-toggle" class="w-full text-center text-sm text-brown-light mt-4 hover:text-brown">ยังไม่มีบัญชี? สมัครสมาชิก</button>
        <p id="config-warning" class="text-xs text-status-ready mt-4 text-center hidden">
          ⚠️ ยังไม่ได้ใส่ Supabase URL/Key ในไฟล์ config.js — แก้ก่อนถึงจะล็อกอินได้
        </p>
      </div>
    </div>`;

    if (window.SH_CONFIG.SUPABASE_URL.includes("YOUR-PROJECT")) {
      document.getElementById("config-warning").classList.remove("hidden");
    }

    let mode = "signin";
    const form = document.getElementById("auth-form");
    const fullnameWrap = document.getElementById("fullname-wrap");
    const fullnameInput = document.getElementById("full_name");
    const submitBtn = document.getElementById("auth-submit");
    const errEl = document.getElementById("auth-error");

    document.getElementById("mode-toggle").addEventListener("click", () => {
      mode = mode === "signin" ? "signup" : "signin";
      fullnameWrap.classList.toggle("hidden", mode !== "signup");
      fullnameInput.required = mode === "signup";
      submitBtn.textContent = mode === "signin" ? "เข้าสู่ระบบ" : "สมัครสมาชิก";
      document.getElementById("mode-toggle").textContent =
        mode === "signin" ? "ยังไม่มีบัญชี? สมัครสมาชิก" : "มีบัญชีแล้ว? เข้าสู่ระบบ";
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.classList.add("hidden");
      submitBtn.disabled = true;
      submitBtn.textContent = "กำลังโหลด...";
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;
      const error =
        mode === "signin"
          ? await signInWithPassword(email, password)
          : await signUp(email, password, fullnameInput.value);
      submitBtn.disabled = false;
      submitBtn.textContent = mode === "signin" ? "เข้าสู่ระบบ" : "สมัครสมาชิก";
      if (error) {
        errEl.textContent = error;
        errEl.classList.remove("hidden");
      }
    });
  }

  // ------------------------------------------------------------
  // Boot (called from boot.js after all page scripts are loaded)
  // ------------------------------------------------------------
  SH.boot = function () {
    SH.client.auth.onAuthStateChange((_event, session) => {
      currentSession = session;
      SH.route();
    });

    SH.client.auth.getSession().then(({ data }) => {
      currentSession = data.session;
      SH.route();
    }).catch((err) => {
      app.innerHTML = `<div class="min-h-screen flex items-center justify-center p-6 text-center text-sm text-status-ready max-w-md mx-auto">
        เชื่อมต่อ Supabase ไม่สำเร็จ — ตรวจสอบ SUPABASE_URL / SUPABASE_ANON_KEY ในไฟล์ config.js<br/><br/>
        <span class="text-brown-light">${SH.esc(err && err.message ? err.message : String(err))}</span>
      </div>`;
    });

    window.addEventListener("hashchange", SH.route);
  };
})();


window.SH = window.SH || {};
window.SH.pages = window.SH.pages || {};

window.SH.pages.renderDashboard = async function (container) {
  const [{ data: exams }, { data: tasks }, dueReviews] = await Promise.all([
    SH.client.from("exams").select("*").order("exam_date", { ascending: true }),
    SH.client.from("tasks").select("*").order("deadline", { ascending: true, nullsFirst: false }),
    fetchDueReviews(),
  ]);

  const today = new Date();
  const upcomingExams = (exams ?? []).filter((e) => SH.daysUntil(e.exam_date) >= 0).slice(0, 3);
  const todaysTasks = (tasks ?? []).filter((t) => t.status === "To-Do" && t.planned_date === SH.todayStr());
  const backlogTasks = (tasks ?? []).filter((t) => t.status === "To-Do" && !t.planned_date && !t.deadline);

  container.innerHTML = `
  <div class="p-6 max-w-4xl mx-auto space-y-6 pb-24">
    <header>
      <h1 class="text-2xl font-display font-semibold text-brown-dark">วันนี้ของเธอ 🧋</h1>
      <p class="text-sm text-brown-light">${today.toLocaleDateString("th-TH", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}</p>
    </header>

    <div class="grid sm:grid-cols-3 gap-3">
      ${
        upcomingExams.length === 0
          ? `<div class="col-span-3 bg-white rounded-2xl shadow-cozy p-4 text-sm text-brown-light">ยังไม่มีสอบที่กำลังจะมาถึง — เพิ่มวิชาสอบได้จากคลังสอบ</div>`
          : upcomingExams
              .map((exam) => {
                const days = SH.daysUntil(exam.exam_date);
                return `
              <div class="bg-white rounded-2xl shadow-cozy p-4 border-l-4 border-status-ready">
                <div class="text-xs text-brown-light">${SH.esc(exam.type)}</div>
                <div class="font-medium text-brown-dark truncate">${SH.esc(exam.subject_name)}</div>
                <div class="text-2xl font-display font-semibold text-status-ready mt-1">${days === 0 ? "วันนี้!" : `เหลือ ${days} วัน`}</div>
              </div>`;
              })
              .join("")
      }
    </div>

    <section class="bg-white rounded-2xl shadow-cozy p-5">
      <h2 class="font-display font-medium text-brown-dark mb-3">งานวันนี้</h2>
      <form id="quick-task-form" class="flex gap-2 mb-3">
        <input id="quick-task-title" placeholder="เพิ่มงานเร็ว ๆ..." class="flex-1 px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm focus:outline-none focus:ring-2 focus:ring-brown-light" />
        <button type="submit" class="px-4 py-2 rounded-xl bg-milktea-caramel text-brown-dark text-sm font-medium">เพิ่ม</button>
      </form>
      ${
        todaysTasks.length === 0
          ? `<p class="text-sm text-brown-light">ไม่มีงานที่วางแผนไว้วันนี้ 🌤️</p>`
          : `<ul class="space-y-2">
              ${todaysTasks
                .map(
                  (t) => `
                <li class="flex items-center gap-3">
                  <input type="checkbox" data-task-toggle="${t.id}" ${t.status === "Done" ? "checked" : ""} class="w-4 h-4 accent-brown" />
                  <span class="text-sm text-brown-dark">${SH.esc(t.title)}</span>
                </li>`
                )
                .join("")}
            </ul>`
      }
    </section>

    <section class="bg-white rounded-2xl shadow-cozy p-5">
      <h2 class="font-display font-medium text-brown-dark mb-3 flex items-center gap-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 5v6h6"/></svg>
        ทบทวนวันนี้
      </h2>
      ${
        dueReviews.length === 0
          ? `<p class="text-sm text-brown-light">ไม่มีหัวข้อที่ต้องทบทวนวันนี้ ✨</p>`
          : `<ul class="space-y-2">
              ${dueReviews
                .map(
                  (r) => `
                <li class="flex items-center justify-between px-3 py-2 rounded-xl bg-cream-card">
                  <div>
                    <div class="text-sm text-brown-dark">${SH.esc(r.topic_title)}</div>
                    <div class="text-xs text-brown-light">${SH.esc(r.exam_title)}</div>
                  </div>
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#F0B57A" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
                </li>`
                )
                .join("")}
            </ul>`
      }
    </section>

    <section class="bg-white rounded-2xl shadow-cozy overflow-hidden">
      <button id="backlog-toggle" class="w-full flex items-center justify-between p-5 font-display font-medium text-brown-dark">

window.SH.pages.renderExamWorkspace = async function (container, examId) {
  const { data: topics } = await SH.client
    .from("topics")
    .select("*")
    .eq("exam_id", examId)
    .order("order_index", { ascending: true });

  const flat = topics ?? [];
  const tree = buildTree(flat);
  const coveragePct = flat.length
    ? Math.round((flat.filter((t) => ["อ่านแล้ว", "ทวนแล้ว", "พร้อมสอบ"].includes(t.status)).length / flat.length) * 100)
    : 0;
  const readyPct = flat.length
    ? Math.round((flat.filter((t) => t.status === "พร้อมสอบ").length / flat.length) * 100)
    : 0;

  container.innerHTML = `
  <div class="p-6 max-w-3xl mx-auto space-y-5 pb-24">
    <div class="grid grid-cols-2 gap-3">
      ${progressCard("Coverage", coveragePct, "bg-status-read")}
      ${progressCard("Exam Ready", readyPct, "bg-status-ready")}
    </div>

    <div class="bg-white rounded-2xl shadow-cozy p-5">
      <h2 class="font-display font-medium text-brown-dark mb-3">โครงสร้างหัวข้อ</h2>
      <div id="topic-tree">${tree.map((t) => topicNodeHtml(t, 0)).join("")}</div>

      <form id="add-topic-form" class="flex gap-2 mt-4 pt-3 border-t border-milktea-light">
        <input id="new-topic-title" placeholder="หัวข้อใหม่ (ระดับบนสุด)..." class="flex-1 px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm" />
        <button type="submit" class="px-4 py-2 rounded-xl bg-milktea-caramel text-brown-dark text-sm font-medium">เพิ่ม</button>
      </form>
    </div>
  </div>`;

  document.getElementById("add-topic-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const input = document.getElementById("new-topic-title");
    const title = input.value.trim();
    if (!title) return;
    await SH.client.from("topics").insert({ exam_id: examId, title, parent_id: null });
    SH.route();
  });

  // Status change (delegated)
  container.querySelectorAll("[data-status-select]").forEach((sel) => {
    sel.addEventListener("change", async () => {
      const id = sel.getAttribute("data-status-select");
      await SH.client.from("topics").update({ status: sel.value }).eq("id", id);
      SH.route();
    });
  });

  // Confidence hearts (delegated)
  container.querySelectorAll("[data-heart-value]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const wrap = btn.closest("[data-topic-hearts]");
      const id = wrap.getAttribute("data-topic-hearts");
      const value = Number(btn.getAttribute("data-heart-value"));
      await SH.client.from("topics").update({ confidence_level: value }).eq("id", id);
      SH.route();
    });
  });

  // Expand/collapse (no server round-trip needed)
  container.querySelectorAll("[data-toggle-expand]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-toggle-expand");
      const childrenEl = document.getElementById(`children-${id}`);
      const icon = btn.querySelector("svg");
      if (childrenEl) {
        const hidden = childrenEl.classList.toggle("hidden");
        icon.style.transform = hidden ? "rotate(-90deg)" : "rotate(0deg)";
      }
    });
  });

  // Add sub-topic (simple prompt — keeps nested-tree UI manageable without a modal system)
  container.querySelectorAll("[data-add-child]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      const parentId = btn.getAttribute("data-add-child");
      const title = prompt("ชื่อหัวข้อย่อย:");
      if (!title || !title.trim()) return;
      await SH.client.from("topics").insert({ exam_id: examId, title: title.trim(), parent_id: parentId });
      SH.route();
    });
  });
}

function buildTree(topics) {
  const byId = new Map(topics.map((t) => [t.id, { ...t, children: [] }]));
  const roots = [];
  byId.forEach((t) => {
    if (t.parent_id && byId.has(t.parent_id)) byId.get(t.parent_id).children.push(t);
    else roots.push(t);
  });
  return roots;
}

function topicNodeHtml(topic, depth) {
  const hasChildren = topic.children && topic.children.length > 0;
  const statusOptions = SH.STATUS_ORDER.map(
    (s) => `<option value="${s}" ${s === topic.status ? "selected" : ""}>${s}</option>`
  ).join("");

  return `
  <div>
    <div class="flex items-center gap-2 py-2 group" style="padding-left:${depth * 20}px">
      <button data-toggle-expand="${topic.id}" class="text-brown-light ${hasChildren ? "" : "invisible"}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transition: transform .15s"><path d="M9 6l6 6-6 6"/></svg>
      </button>
      <a href="#/exams/${topic.exam_id}/topics/${topic.id}" class="flex-1 text-sm text-brown-dark hover:underline truncate">${SH.esc(topic.title)}</a>
      <div data-topic-hearts="${topic.id}">${SH.heartRow(topic.confidence_level, 12, true)}</div>
      <select data-status-select="${topic.id}" class="text-xs">${statusOptions}</select>
      <span class="hidden sm:inline-flex px-3 py-1 rounded-full text-xs font-medium shadow-sm ${SH.STATUS_COLOR[topic.status]}">${topic.status}</span>
      <button data-add-child="${topic.id}" class="opacity-0 group-hover:opacity-100 text-brown-light hover:text-brown" title="เพิ่มหัวข้อย่อย">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </div>
    ${
      hasChildren
        ? `<div id="children-${topic.id}">${topic.children.map((c) => topicNodeHtml(c, depth + 1)).join("")}</div>`
        : ""
    }
  </div>`;
}

  <div class="p-6 max-w-2xl mx-auto space-y-4 pb-24">
    <a href="#/special-tests" class="flex items-center gap-1 text-sm text-brown-light hover:text-brown w-fit">

      กลับไปคลัง
    </a>

    <div class="flex items-start justify-between">
      <div>
        <div class="text-xs text-brown-light">${SH.esc(test.body_region)}</div>
        <h1 class="text-xl font-display font-semibold text-brown-dark">${SH.esc(test.test_name)}</h1>

      </button>
    </div>

    <button id="quiz-toggle" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium shadow-cozy transition-colors ${
      quizMode ? "bg-status-ready text-white" : "bg-milktea-caramel text-brown-dark"
    }">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.2 1 2.3h6c0-1.1.4-1.9 1-2.3A7 7 0 0 0 12 2z"/><path d="M9 18h6M10 22h4"/></svg>
      ${quizMode ? "ออกจาก Quiz Me" : "Quiz Me — ทดสอบตัวเอง"}
    </button>

    <div class="bg-white rounded-2xl shadow-cozy p-5 space-y-4">
      ${maskedField("วัตถุประสงค์ (Purpose)", test.purpose, false)}
      <div class="grid sm:grid-cols-2 gap-4">
        ${maskedField("ท่าผู้ป่วย (Patient Position)", test.patient_position, false)}
        ${maskedField("ท่านักกายภาพ (Therapist Position)", test.therapist_position, false)}
      </div>
      ${maskedField("วิธีทำ (Execution Procedure)", test.execution_procedure, false)}

      <div class="border-t border-milktea-light pt-4 space-y-4">
        ${maskedField("Positive Sign", test.positive_sign, quizMode)}
        ${maskedField("การแปลผล (Interpretation)", test.interpretation, quizMode)}
        <div class="grid sm:grid-cols-2 gap-4">
          ${maskedField("Sensitivity (%)", test.sensitivity !== null ? `${test.sensitivity}%` : null, quizMode)}
          ${maskedField("Specificity (%)", test.specificity !== null ? `${test.specificity}%` : null, quizMode)}
        </div>
        ${maskedField("Differential Diagnosis", test.differential_diagnosis, quizMode)}
      </div>
    </div>
  </div>`;

  document.getElementById("quiz-toggle").addEventListener("click", () => {
    quizMode = !quizMode;
    SH.route();
  });

  document.getElementById("delete-test-btn").addEventListener("click", async () => {
    if (!confirm("ลบ Special Test นี้?")) return;
    await SH.client.from("special_tests").delete().eq("id", test.id);
    SH.go("/special-tests");
  });

  // Per-field reveal toggle (only present on masked fields)
  container.querySelectorAll("[data-reveal-toggle]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const fieldId = btn.getAttribute("data-reveal-toggle");
      const valueEl = document.getElementById(`field-value-${fieldId}`);
      const revealed = valueEl.classList.toggle("blurred-off");
      valueEl.classList.toggle("blurred", !revealed);
      btn.querySelector("[data-reveal-label]").textContent = revealed ? "ซ่อน" : "เฉลย";
    });

let fieldCounter = 0;
function maskedField(label, value, masked) {
  fieldCounter++;
  const id = fieldCounter;
  const display = value ?? "—";
  return `
  <div>
    <div class="flex items-center justify-between mb-1">
      <span class="text-xs font-medium text-brown-light">${SH.esc(label)}</span>
      ${
        masked
          ? `<button data-reveal-toggle="${id}" class="text-brown-light hover:text-brown flex items-center gap-1 text-xs">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span data-reveal-label>เฉลย</span>
            </button>`
          : ""
      }
    </div>
    <div id="field-value-${id}" class="text-sm rounded-xl px-3 py-2 min-h-[2.5rem] ${
      masked ? "bg-milktea-light blurred" : "bg-cream-card"
    } text-brown-dark">${SH.esc(display)}</div>
  </div>`;
}


window.SH = window.SH || {};
window.SH.pages = window.SH.pages || {};

let cardTypeFilter = "All"; // "All" | "Basic" | "Compare"

window.SH.pages.renderFlashcards = async function (container) {
  let query = SH.client.from("flashcards").select("*").in("card_type", ["Basic", "Compare"]).order("created_at", { ascending: false });
  if (cardTypeFilter !== "All") query = query.eq("card_type", cardTypeFilter);
  const { data: cards } = await query;

  container.innerHTML = `
  <div class="p-6 max-w-4xl mx-auto space-y-4 pb-24">
    <div class="flex items-center justify-between">
      <h1 class="text-2xl font-display font-semibold text-brown-dark flex items-center gap-2">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2 2 7l10 5 10-5z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>
        Flashcards
      </h1>
      <button id="toggle-card-form" class="flex items-center gap-1 px-4 py-2 rounded-full bg-brown text-white text-sm font-medium shadow-cozy">+ การ์ดใหม่</button>
    </div>

    <div class="flex gap-2">
      ${["All", "Basic", "Compare"]
        .map(
          (t) => `<button data-type-filter="${t}" class="px-3 py-1.5 rounded-full text-xs font-medium border transition-colors ${
            cardTypeFilter === t ? "bg-brown text-white border-brown" : "bg-white text-brown-light border-milktea-light hover:bg-cream-card"
          }">${t === "All" ? "ทั้งหมด" : t}</button>`
        )
        .join("")}
    </div>

    <form id="card-form" class="hidden bg-white rounded-2xl shadow-cozy p-5 space-y-3">
      <div>
        <label class="text-xs font-medium text-brown-light mb-1 block">ประเภทการ์ด</label>
        <select id="f-card-type" class="w-full px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm">
          <option value="Basic">Basic — หน้า/หลัง</option>
          <option value="Compare">Compare — เปรียบเทียบ</option>
        </select>
      </div>
      <div>
        <label class="text-xs font-medium text-brown-light mb-1 block">หมวดหมู่</label>
        <input id="f-category" placeholder="เช่น Neuro, Ortho" class="w-full px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm" />
      </div>

      <div id="basic-fields" class="space-y-3">
        <div>
          <label class="text-xs font-medium text-brown-light mb-1 block">คำถาม (หน้าการ์ด)</label>
          <textarea id="f-front" rows="2" class="w-full px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm"></textarea>
        </div>
        <div>
          <label class="text-xs font-medium text-brown-light mb-1 block">คำตอบ (หลังการ์ด)</label>
          <textarea id="f-back" rows="2" class="w-full px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm"></textarea>
        </div>
      </div>

      <div id="compare-fields" class="hidden space-y-3">
        <div class="grid sm:grid-cols-2 gap-3">
          <input id="f-entity-a" placeholder="สิ่งที่ 1 (เช่น ACL tear)" class="px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm" />
          <input id="f-entity-b" placeholder="สิ่งที่ 2 (เช่น MCL tear)" class="px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm" />
        </div>
        <div>
          <label class="text-xs font-medium text-brown-light mb-1 block">ตารางเทียบ — 1 บรรทัดต่อ 1 ประเด็น รูปแบบ: หัวข้อ | ค่าของสิ่งที่1 | ค่าของสิ่งที่2</label>
          <textarea id="f-matrix" rows="4" placeholder="Mechanism | Pivot shift | Valgus stress&#10;Special test | Lachman | Valgus stress test" class="w-full px-3 py-2 rounded-xl border border-milktea-light bg-cream-card text-sm font-mono"></textarea>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button type="submit" class="px-5 py-2 rounded-full bg-brown text-white text-sm font-medium shadow-cozy">บันทึก</button>
        <button type="button" id="cancel-card-form" class="px-5 py-2 rounded-full text-brown-light text-sm">ยกเลิก</button>
      </div>
    </form>

    ${
      (cards ?? []).length === 0
        ? `<div class="bg-white rounded-2xl shadow-cozy p-8 text-center text-sm text-brown-light">ยังไม่มีการ์ด — เพิ่มอันแรกเลย!</div>`
        : `<div class="grid sm:grid-cols-2 gap-3" id="cards-grid">${(cards ?? []).map(cardHtml).join("")}</div>`
    }
  </div>`;

  document.getElementById("toggle-card-form").addEventListener("click", () => {
    document.getElementById("card-form").classList.toggle("hidden");
  });
  document.getElementById("cancel-card-form").addEventListener("click", () => {
    document.getElementById("card-form").classList.add("hidden");
  });

  document.getElementById("f-card-type").addEventListener("change", (e) => {
    const isCompare = e.target.value === "Compare";
    document.getElementById("basic-fields").classList.toggle("hidden", isCompare);
    document.getElementById("compare-fields").classList.toggle("hidden", !isCompare);
  });

  container.querySelectorAll("[data-type-filter]").forEach((btn) => {
    btn.addEventListener("click", () => {
      cardTypeFilter = btn.getAttribute("data-type-filter");
      SH.route();
    });
  });

  document.getElementById("card-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const { data: userData } = await SH.client.auth.getUser();
    const type = document.getElementById("f-card-type").value;
    const category = document.getElementById("f-category").value.trim() || null;

    if (type === "Basic") {
      const front = document.getElementById("f-front").value.trim();
      const back = document.getElementById("f-back").value.trim();
      if (!front) return;
      await SH.client.from("flashcards").insert({
        user_id: userData.user.id, card_type: "Basic", category, front, back,
      });
    } else {
      const entityA = document.getElementById("f-entity-a").value.trim();
      const entityB = document.getElementById("f-entity-b").value.trim();
      const matrixText = document.getElementById("f-matrix").value.trim();
      if (!entityA || !entityB) return;
      const matrix = {};
      matrixText.split("\n").forEach((line) => {
        const parts = line.split("|").map((s) => s.trim());
        if (parts.length === 3 && parts[0]) matrix[parts[0]] = [parts[1] || "", parts[2] || ""];
      });
      await SH.client.from("flashcards").insert({
        user_id: userData.user.id, card_type: "Compare", category,
        compare_entity_a: entityA, compare_entity_b: entityB, comparison_matrix: matrix,
      });
    }
    SH.route();
  });

  // Flip Basic cards on click
  container.querySelectorAll("[data-flip-card]").forEach((el) => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-delete-card]")) return;
      el.classList.toggle("is-flipped");
      const front = el.querySelector("[data-face='front']");
      const back = el.querySelector("[data-face='back']");
      const flipped = el.classList.contains("is-flipped");
      front.classList.toggle("hidden", flipped);
      back.classList.toggle("hidden", !flipped);
    });
  });

  // Delete
  container.querySelectorAll("[data-delete-card]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = btn.getAttribute("data-delete-card");
      if (!confirm("ลบการ์ดนี้?")) return;
      await SH.client.from("flashcards").delete().eq("id", id);
      SH.route();
    });
  });
};

function cardHtml(card) {
  if (card.card_type === "Compare") {
    const matrix = card.comparison_matrix || {};
    const rows = Object.entries(matrix)
      .map(
        ([k, v]) => `
        <tr class="border-t border-milktea-light">
          <td class="py-1.5 pr-2 text-xs text-brown-light align-top">${SH.esc(k)}</td>
          <td class="py-1.5 pr-2 text-xs text-brown-dark align-top">${SH.esc(v[0])}</td>
          <td class="py-1.5 text-xs text-brown-dark align-top">${SH.esc(v[1])}</td>
        </tr>`
      )
      .join("");
    return `
    <div class="bg-white rounded-2xl shadow-cozy p-4 relative">
      <button data-delete-card="${card.id}" class="absolute top-3 right-3 text-brown-light hover:text-status-ready">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
      </button>
      ${card.category ? `<div class="text-xs text-brown-light mb-1">${SH.esc(card.category)}</div>` : ""}
      <div class="text-sm font-medium text-brown-dark mb-2">${SH.esc(card.compare_entity_a)} vs ${SH.esc(card.compare_entity_b)}</div>
      <table class="w-full">
        <thead><tr class="text-xs text-brown-light"><th class="text-left font-medium pb-1"></th><th class="text-left font-medium pb-1">${SH.esc(card.compare_entity_a)}</th><th class="text-left font-medium pb-1">${SH.esc(card.compare_entity_b)}</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
  }

  return `
  <div data-flip-card class="bg-white rounded-2xl shadow-cozy p-4 relative cursor-pointer min-h-[100px]">
    <button data-delete-card="${card.id}" class="absolute top-3 right-3 text-brown-light hover:text-status-ready">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
    </button>
    ${card.category ? `<div class="text-xs text-brown-light mb-1">${SH.esc(card.category)}</div>` : ""}
    <div data-face="front" class="text-sm text-brown-dark pr-6">${SH.esc(card.front || "—")}</div>
    <div data-face="back" class="hidden text-sm text-brown-dark pr-6">${SH.esc(card.back || "—")}</div>
    <div class="text-xs text-brown-light mt-3">แตะเพื่อพลิกการ์ด</div>
  </div>`;
}

  let searchTimer;
  document.getElementById("drug-search").addEventListener("input", (e) => {

        <input id="f-drug-class" placeholder="เช่น NSAIDs" class="${inputCls}" />

    </div>
    <div>
      <label class="${labelCls}">กลไกการออกฤทธิ์ (MOA)</label>
      <textarea id="f-moa" rows="2" class="${inputCls}"></textarea>
    </div>
    <div>
      <label class="${labelCls}">ข้อบ่งใช้ (Indications)</label>
      <textarea id="f-indications" rows="2" class="${inputCls}"></textarea>
    </div>
    <div>
      <label class="${labelCls}">ผลข้างเคียง (Adverse Effects)</label>
      <textarea id="f-adverse" rows="2" class="${inputCls}"></textarea>
    </div>
    <div>
      <label class="${labelCls}">ข้อห้ามใช้ (Contraindications)</label>
      <textarea id="f-contra" rows="2" class="${inputCls}"></textarea>
    </div>
    <div>
      <label class="${labelCls}">สรุปจำ (Key Takeaways)</label>
      <textarea id="f-key" rows="2" class="${inputCls}"></textarea>
    </div>`;
}

// ============================================================
// Drug Detail — with Quiz Me mode
// ============================================================
let drugQuizMode = false;
let drugFieldCounter = 0;

window.SH.pages.renderDrugDetail = async function (container, drugId) {
  const { data: drug } = await SH.client.from("flashcards").select("*").eq("id", drugId).single();
  if (!drug) {
    container.innerHTML = `<div class="p-6 text-sm text-brown-light">ไม่พบยานี้</div>`;
    return;
  }

  container.innerHTML = `
  <div class="p-6 max-w-2xl mx-auto space-y-4 pb-24">
    <a href="#/drugs" class="flex items-center gap-1 text-sm text-brown-light hover:text-brown w-fit">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
      กลับไปคลังยา
    </a>

    <div class="flex items-start justify-between">
      <div>
        ${drug.drug_class ? `<div class="text-xs text-brown-light">${SH.esc(drug.drug_class)}</div>` : ""}
        <h1 class="text-xl font-display font-semibold text-brown-dark">${SH.esc(drug.drug_name)}</h1>
      </div>
      <button id="delete-drug-btn" class="text-status-ready hover:opacity-70">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>
      </button>
    </div>

    <button id="drug-quiz-toggle" class="flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium shadow-cozy transition-colors ${
      drugQuizMode ? "bg-status-ready text-white" : "bg-milktea-caramel text-brown-dark"
    }">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a7 7 0 0 0-4 12.7c.6.4 1 1.2 1 2.3h6c0-1.1.4-1.9 1-2.3A7 7 0 0 0 12 2z"/><path d="M9 18h6M10 22h4"/></svg>
      ${drugQuizMode ? "ออกจาก Quiz Me" : "Quiz Me — ทดสอบตัวเอง"}
    </button>

    <div class="bg-white rounded-2xl shadow-cozy p-5 space-y-4">
      ${drugMaskedField("กลไกการออกฤทธิ์ (MOA)", drug.moa, drugQuizMode)}
      ${drugMaskedField("ข้อบ่งใช้ (Indications)", drug.indications, drugQuizMode)}
      ${drugMaskedField("ผลข้างเคียง (Adverse Effects)", drug.adverse_effects, drugQuizMode)}
      ${drugMaskedField("ข้อห้ามใช้ (Contraindications)", drug.contraindications, drugQuizMode)}
      ${drugMaskedField("สรุปจำ (Key Takeaways)", drug.key_takeaways, drugQuizMode)}
    </div>
  </div>`;

  document.getElementById("drug-quiz-toggle").addEventListener("click", () => {
    drugQuizMode = !drugQuizMode;
    SH.route();
  });

  document.getElementById("delete-drug-btn").addEventListener("click", async () => {
    if (!confirm("ลบยานี้ออกจากคลัง?")) return;
    await SH.client.from("flashcards").delete().eq("id", drug.id);
    SH.go("/drugs");
  });

  container.querySelectorAll("[data-drug-reveal]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const fieldId = btn.getAttribute("data-drug-reveal");
      const valueEl = document.getElementById(`drug-field-${fieldId}`);
      const revealed = valueEl.classList.toggle("blurred-off");
      valueEl.classList.toggle("blurred", !revealed);
      btn.querySelector("[data-drug-reveal-label]").textContent = revealed ? "ซ่อน" : "เฉลย";
    });
  });
};

function drugMaskedField(label, value, masked) {
  drugFieldCounter++;
  const id = drugFieldCounter;
  const display = value ?? "—";
  return `
  <div>
    <div class="flex items-center justify-between mb-1">
      <span class="text-xs font-medium text-brown-light">${SH.esc(label)}</span>
      ${
        masked
          ? `<button data-drug-reveal="${id}" class="text-brown-light hover:text-brown flex items-center gap-1 text-xs">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <span data-drug-reveal-label>เฉลย</span>
            </button>`
          : ""
      }
    </div>
    <div id="drug-field-${id}" class="text-sm rounded-xl px-3 py-2 min-h-[2.5rem] ${
      masked ? "bg-milktea-light blurred" : "bg-cream-card"
    } text-brown-dark">${SH.esc(display)}</div>
  </div>`;
}


// ============================================================
// BOOT
// ============================================================
window.SH.boot();
  </script>
</body>
